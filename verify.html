<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards & Offers</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #111;
  background: repeating-linear-gradient(
    -45deg, white 0px, white 70px,
    #dffcff 70px, #dffcff 140px
  );
  background-size: 280px 280px;
  animation: moveBg 8s linear infinite;
}
@keyframes moveBg {
  to { background-position: 280px 280px; }
}
header {
  text-align: center;
  padding: 25px;
}
main {
  max-width: 520px;
  margin: 20px auto;
  padding: 18px;
}
.card {
  background: white;
  border: 4px solid #111;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 10px 0 #111;
}
.offer {
  border: 2px solid #111;
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0;
}
.offer h3 { margin-top: 0; }
.button {
  display: block;
  padding: 14px;
  background: #111;
  color: white;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
}
.notice {
  font-size: 14px;
  line-height: 1.5;
}
</style>
</head>
<body>

<header>
  <h1>REWARDS & OFFERS</h1>
  <p>Explore available sponsored offers</p>
</header>

<main>
  <a href="index.html">← Back</a>
  <br><br>

  <div class="card">
    <h2>Available Offers</h2>

    <p class="notice">
      Offers are automatically selected for your
      country and device. We may earn a commission.
      Completing an offer does not guarantee a gift card.
    </p>

    <div id="offers">Loading offers...</div>
  </div>
</main>

<script>
async function loadOffers() {
  const container = document.getElementById("offers");

  try {
    const response = await fetch(
      "https://jimmygiveaway.sinscatbombastic.workers.dev/offers"
    );

    if (!response.ok) throw new Error();

    const offers = await response.json();
    container.replaceChildren();

    if (!Array.isArray(offers) || !offers.length) {
      container.textContent =
        "No offers currently available.";
      return;
    }

    offers.slice(0, 10).forEach(offer => {
      const card = document.createElement("div");
      card.className = "offer";

      const title = document.createElement("h3");
      title.textContent = offer.name || "Sponsored offer";

      const description = document.createElement("p");
      description.textContent = offer.anchor || "";

      const requirement = document.createElement("p");
      requirement.textContent =
        "Requirement: " + (offer.conversion || "See offer terms");

      const link = document.createElement("a");
      link.className = "button";

      const destination = new URL(offer.url);
      if (destination.protocol !== "https:") return;

      link.href = destination.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer sponsored";
      link.textContent = "VIEW OFFER";

      card.append(title, description, requirement, link);
      container.appendChild(card);
    });

  } catch {
    container.textContent =
      "Unable to load offers. Please try again later.";
  }
}

loadOffers();
</script>

</body>
</html>
