<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reward Preview</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #111;
  background: repeating-linear-gradient(
    -45deg, white 0px, white 70px,
    #dffcff 70px, #dffcff 140px
  );
  background-size: 280px 280px;
  animation: moveBg 8s linear infinite;
}
@keyframes moveBg {
  to { background-position: 280px 280px; }
}
header { text-align: center; padding: 25px; }
main { max-width: 520px; margin: 20px auto; padding: 18px; }
.card {
  background: white;
  border: 4px solid #111;
  border-radius: 20px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 10px 0 #111;
}
img.reward {
  width: 230px;
  height: 145px;
  object-fit: contain;
}
button, .button {
  display: block;
  width: 100%;
  padding: 16px;
  background: #111;
  color: white;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}
.offer {
  border: 2px solid #111;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  text-align: left;
}
.notice { font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>REWARDS & OFFERS</h1>
  <div id="date"></div>
</header>

<main>
  <a href="index.html">← Back to Rewards</a>
  <br><br>

  <section class="card" id="preview">
    <img class="reward" id="image" alt="Selected gift card">
    <h1 id="name"></h1>
    <h1 id="value"></h1>

    <p><strong>REWARD PREVIEW</strong></p>
    <p class="notice">
      This is a gift-card preview, not an issued reward.
      Sponsored offers do not guarantee a gift card.
    </p>

    <button onclick="loadOffers()">VERIFY NOW</button>
  </section>

  <section class="card" id="offerPage" hidden>
    <h2>Available Offers</h2>
    <p class="notice">
      Sponsored offers selected for your country and device.
      We may earn a commission.
    </p>
    <div id="offers">Loading offers...</div>
  </section>
</main>

<script>
const rewards = {
  playstation: ["PlayStation", "$100", "downloadplaystat.png"],
  minecraft: ["Minecraft", "$26.95", "downloadmine.jfif"],
  google: ["Google Play", "$100", "downloadggplay.png"],
  apple: ["Apple", "$100", "downloadios.png"],
  itunes: ["iTunes", "$100", "downloaditune.png"],
  xbox: ["Xbox", "$100", "downloadxbox.png"],
  steam: ["Steam", "$100", "downloadsteam.jfif"],
  roblox: ["Roblox", "$100", "downloadrobo.jfif"],
  razer: ["Razer Gold", "$100", "imagesrazer.png"],
  gaming: ["Gaming", "$100", "images%20%281%29gaming.jfif"],
  riot: ["Riot Games", "$100", "images%20%281%29riot.jfif"],
  fortnite: ["Fortnite", "$100", "downloadort.jfif"]
};

const key = new URLSearchParams(location.search).get("reward");
const reward = rewards[key] || rewards.playstation;

document.getElementById("name").textContent = reward[0];
document.getElementById("value").textContent = reward[1];
document.getElementById("image").src = reward[2];
document.getElementById("date").textContent =
  new Date().toLocaleDateString();

async function loadOffers() {
  document.getElementById("preview").hidden = true;
  document.getElementById("offerPage").hidden = false;

  const container = document.getElementById("offers");

  try {
    const response = await fetch(
      "https://jimmygiveaway.sinscatbombastic.workers.dev/offers"
    );

    if (!response.ok) throw new Error();

    const offers = await response.json();
    container.replaceChildren();

    if (!Array.isArray(offers) || !offers.length) {
      container.textContent = "No offers currently available.";
      return;
    }

    for (const offer of offers.slice(0, 10)) {
      let destination;

      try {
        destination = new URL(offer.url);
        if (destination.protocol !== "https:") continue;
      } catch {
        continue;
      }

      const card = document.createElement("div");
      card.className = "offer";

      const title = document.createElement("h3");
      title.textContent = offer.name || "Sponsored offer";

      const description = document.createElement("p");
      description.textContent = offer.anchor || "";

      const requirement = document.createElement("p");
      requirement.textContent =
        "Requirement: " + (offer.conversion || "See offer terms");

      const link = document.createElement("a");
      link.className = "button";
      link.href = destination.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer sponsored";
      link.textContent = "VIEW OFFER";

      card.append(title, description, requirement, link);
      container.appendChild(card);
    }

    if (!container.children.length) {
      container.textContent = "No available offers.";
    }
  } catch {
    container.textContent = "Unable to load offers. Please try again.";
  }
}
</script>
</body>
</html>
