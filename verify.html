
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards & Offers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #111;
  min-height: 100vh;
  background: repeating-linear-gradient(
    -45deg, #fff 0px, #fff 70px,
    #dcfaff 70px, #dcfaff 140px
  );
  background-size: 280px 280px;
  animation: moveBg 8s linear infinite;
}

@keyframes moveBg {
  to { background-position: 280px 280px; }
}

header {
  text-align: center;
  padding: 30px 15px;
}

main {
  max-width: 400px;
  margin: 20px auto;
  padding: 18px;
}

.card {
  background: white;
  border: 3px solid #111;
  border-radius: 18px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 9px 0 #111;
}

.reward-image {
  width: 180px;
  height: 140px;
  object-fit: contain;
}

button, .offer-button {
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  padding: 15px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: block;
  text-align: center;
}

.notice {
  font-size: 12px;
  line-height: 1.6;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(6px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.overlay.active {
  display: flex;
}

.popup {
  width: 100%;
  max-width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 80px #0006;
  animation: appear .3s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.popup-header {
  position: relative;
  padding: 25px;
  background: linear-gradient(135deg,#009dff,#00cfe8);
  color: white;
  text-align: center;
}

.popup-header h2 {
  margin: 0 0 8px;
}

.close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  background: #0003;
  font-size: 22px;
}

.popup-body {
  padding: 18px;
}

.offer {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px #0001;
}

.offer-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.offer-icon {
  width: 58px;
  height: 58px;
  object-fit: contain;
  border-radius: 10px;
}

.offer h3 {
  font-size: 15px;
  margin: 0 0 5px;
}

.offer p {
  font-size: 12px;
  line-height: 1.5;
}

.offer-button {
  background: linear-gradient(90deg,#008cff,#00b8db);
  margin-top: 10px;
}

.spinner {
  width: 38px;
  height: 38px;
  border: 4px solid #eee;
  border-top-color: #009dff;
  border-radius: 50%;
  margin: 20px auto;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<header>
  <h1>REWARDS & OFFERS</h1>
  <div id="date"></div>
</header>

<main>
  <a href="index.html">← Back to Rewards</a>
  <br><br>

  <section class="card">
    <img id="image" class="reward-image" alt="Gift card">
    <h2 id="name"></h2>
    <h1 id="value"></h1>

    <strong>REWARD PREVIEW</strong>

    <p class="notice">
      Sponsored offers do not guarantee a gift card.
      This preview is not an issued reward.
    </p>

    <button onclick="openOffers()">VERIFY NOW</button>
  </section>
</main>

<div class="overlay" id="overlay"
     role="dialog" aria-modal="true"
     aria-label="Available sponsored offers">

  <div class="popup">

    <div class="popup-header">
      <button class="close" onclick="closeOffers()"
              aria-label="Close">×</button>
      <h2>Available Offers</h2>
      <div>Offers for your country and device</div>
    </div>

    <div class="popup-body">
      <p class="notice">
        Choose an available sponsored offer.
        Review its requirements before continuing.
        We may earn a commission.
      </p>

      <div id="offers"></div>
    </div>

  </div>
</div>

<script>
const rewards = {
  playstation: ["PlayStation", "$100", "downloadplaystat.png"],
  minecraft: ["Minecraft", "$26.95", "downloadmine.jfif"],
  google: ["Google Play", "$200", "downloadggplay.png"],
  apple: ["Apple Gift Card", "$12", "downloadios.png"],
  itunes: ["iTunes", "$500", "downloaditune.png"],
  xbox: ["Xbox", "$100", "downloadxbox.png"],
  steam: ["Steam", "", "downloadsteam.jfif"],
  roblox: ["Roblox", "", "downloadrobo.jfif"],
  razer: ["Razer Gold", "", "imagesrazer.png"],
  gaming: ["Gaming", "$200", "images%20%281%29gaming.jfif"],
  riot: ["Riot Games", "", "images%20%281%29riot.jfif"],
  fortnite: ["Fortnite", "$100", "downloadort.jfif"]
};

const selected = new URLSearchParams(location.search)
  .get("reward");

const reward = rewards[selected] || rewards.playstation;

document.getElementById("name").textContent = reward[0];
document.getElementById("value").textContent = reward[1];
document.getElementById("image").src = reward[2];

document.getElementById("date").textContent =
  new Date().toLocaleDateString();

function closeOffers() {
  document.getElementById("overlay").classList.remove("active");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeOffers();
});

async function openOffers() {
  document.getElementById("overlay").classList.add("active");
  document.body.style.overflow = "hidden";

  const container = document.getElementById("offers");

  container.innerHTML =
    '<div class="spinner"></div>' +
    '<p style="text-align:center">Loading available offers...</p>';

  try {
    const response = await fetch(
      "https://jimmygiveaway.sinscatbombastic.workers.dev/offers",
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const offers = await response.json();
    container.replaceChildren();

    if (!Array.isArray(offers) || !offers.length) {
      container.textContent = "No offers available for your location.";
      return;
    }

    for (const offer of offers.slice(0, 10)) {

      let destination;

      try {
        destination = new URL(offer.url);
        if (destination.protocol !== "https:") continue;
      } catch {
        continue;
      }

      const card = document.createElement("div");
      card.className = "offer";

      const top = document.createElement("div");
      top.className = "offer-top";

      if (offer.network_icon) {
        try {
          const iconUrl = new URL(offer.network_icon);
          if (iconUrl.protocol === "https:") {
            const img = document.createElement("img");
            img.className = "offer-icon";
            img.src = iconUrl.href;
            img.alt = "";
            img.onerror = () => img.remove();
            top.appendChild(img);
          }
        } catch {}
      }

      const title = document.createElement("h3");
      title.textContent = offer.name || "Sponsored Offer";
      top.appendChild(title);

      const description = document.createElement("p");
      description.textContent = offer.anchor || "";

      const requirement = document.createElement("p");
      requirement.textContent =
        "Requirement: " + (offer.conversion || "See offer terms");

      const button = document.createElement("a");
      button.className = "offer-button";
      button.href = destination.href;
      button.target = "_blank";
      button.rel = "noopener noreferrer sponsored";
      button.textContent = "VIEW OFFER →";

      card.append(top, description, requirement, button);
      container.appendChild(card);
    }

    if (!container.children.length) {
      container.textContent = "No available offers.";
    }

  } catch {
    container.textContent =
      "Unable to load offers. Close and try again.";
  }
}
</script>

</body>
</html>
